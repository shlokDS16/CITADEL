[pytest]
# Scoped to the fake_news module ONLY — the legacy ad-hoc test_*.py
# scripts at backend/ root are dead (some hit network/Groq) and must
# never be collected. Add other modules' tests/ dirs here as they land.
pythonpath = .
testpaths = app/modules/fake_news/tests
asyncio_mode = auto
addopts = -q -p no:cacheprovider
filterwarnings =
    ignore::DeprecationWarning
